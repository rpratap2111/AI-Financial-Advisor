# Render's free tier sleeps after about 15 minutes without traffic, and waking
# up takes around a minute. This pings the backend so it stays awake. /ping does
# not call Gemini, so it uses none of the API quota.
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend
        run: >-
          curl --fail --silent --show-error
          --retry 2 --retry-delay 15 --retry-all-errors
          --max-time 90
          https://ai-financial-advisor-yo5z.onrender.com/ping
